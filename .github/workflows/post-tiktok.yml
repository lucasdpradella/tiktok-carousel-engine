name: post-tiktok

# Cron: 8h BRT (= 11:00 UTC) a cada 2 dias → "dia sim, dia não"
# (Brasil é UTC-3 o ano todo, sem horário de verão.)
# GitHub Actions cron tem ~5-15min de jitter; aceitável pro caso.
# workflow_dispatch permite rodar manualmente pra smoke tests.
#
# MODO MANUAL TRANSITÓRIO (desde 2026-05-15):
#   Enquanto a audit do app TikTok não aprovar Direct Post, schedule roda em
#   dry-run forçado (DRY_RUN=true). Gera o carrossel completo + caption,
#   sobe como artifact, mas NÃO chama upload-post.com. Lucas baixa o artifact
#   e posta manualmente. Quando audit aprovar, migrar postar.mjs pra
#   open.tiktokapis.com e remover o lock abaixo.

on:
  schedule:
    - cron: '0 11 */2 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (gera mas não posta) — default TRUE enquanto audit TikTok não aprova'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      scheduled_date:
        description: 'ISO-8601 opcional pra agendar (ex 2026-05-15T07:00:00). Vazio = posta imediato.'
        required: false
        default: ''
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine/openai

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER || 'lucaspradella' }}
      PIPELINE_NICHO: financas-comportamentais
      # Schedule (cron) sem inputs ⇒ inputs.dry_run vira "" ⇒ fallback 'true'
      # (modo manual transitório, ver header). workflow_dispatch respeita escolha.
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
      SCHEDULED_DATE: ${{ inputs.scheduled_date || '' }}
      TIMEZONE: America/Sao_Paulo
      OPENAI_PYTHON_BIN: python3
      # Fila de temas + numeração de capítulo agora vivem em engine/openai/data/
      # (temas.json + estado.json). Supabase descomissionado em 2026-06-17. As GitHub
      # Variables CHAPTER_OFFSET/CHAPTER_TOTAL ficaram sem uso (podem ser deletadas).

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (Pillow + numpy)
        run: pip install --upgrade pip && pip install pillow numpy

      - name: Run end-to-end pipeline
        run: node src/run-completo.mjs

      - name: Upload outputs as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_id }}
          path: engine/openai/outputs/
          if-no-files-found: ignore
          retention-days: 14
