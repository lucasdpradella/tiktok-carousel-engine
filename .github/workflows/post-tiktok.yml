name: post-tiktok

# Cron: 8h BRT (= 11:00 UTC) a cada 2 dias → "dia sim, dia não"
# (Brasil é UTC-3 o ano todo, sem horário de verão.)
# GitHub Actions cron tem ~5-15min de jitter; aceitável pro caso.
# workflow_dispatch permite rodar manualmente pra smoke tests.
#
# FASE 4 SEMI-AUTO (desde 2026-06-18):
#   A engine empurra o carrossel pro INBOX/rascunho do @pradella.lucas via
#   Content Posting API (post_mode MEDIA_UPLOAD, scope video.upload). Ele abre o
#   TikTok e dá "postar" — a API nunca publica sozinha, então é seguro por construção.
#   Fluxo em 2 fases (a API puxa as imagens por URL, então elas precisam estar
#   públicas no Pages ANTES do content/init):
#     FASE 1  node src/run-completo.mjs         → gera + converte PNG→JPEG + stage em docs/
#     (git)   commita/pusha docs/post-*/        → GitHub Pages publica os JPEGs
#     FASE 2  node src/run-completo.mjs --post  → espera Pages + refresh + content/init + avança estado
#     (git)   commita/pusha data/estado.json
#
#   CRON LIGADO (2026-06-18): o run agendado posta de verdade (DRY_RUN=false) — gera,
#   publica no Pages e empurra pro inbox dia-sim/dia-não. O workflow_dispatch manual
#   segue com default dry_run=true (só FASE 1: artifact, sem postar/avançar) pra teste
#   seguro; passe dry_run=false no dispatch quando quiser postar manualmente.

on:
  # CRON DESLIGADO (2026-06-29, virada §0): o PIL de 2 slides foi SUBSTITUÍDO pelo carrossel
  # multi-slide (post-carrossel.yml) + vídeo (post-video.yml), que postam em dias alternados.
  # Mantido só como workflow_dispatch manual (rede de segurança). NÃO religar o schedule.
  # schedule:
  #   - cron: '0 11 */2 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (gera mas não posta no inbox) — default TRUE'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Evita que cron + dispatch concorrentes colidam no git push.
concurrency:
  group: post-tiktok
  cancel-in-progress: false

permissions:
  contents: write # commitar JPEGs em docs/ + estado.json de volta no repo

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine/openai

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Content Posting API (Production). Secrets gerados no one-off OAuth (scripts/tiktok-oauth-prod.mjs).
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      # schedule (cron) POSTA de verdade (DRY_RUN=false). workflow_dispatch respeita a escolha
      # (default 'true' = teste seguro). github.event_name distingue os dois gatilhos.
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
      OPENAI_PYTHON_BIN: python3
      # Fila de temas + numeração vivem em engine/openai/data/ (temas.json + estado.json).
      # Supabase descomissionado em 2026-06-17; upload-post.com substituído pela
      # Content Posting API em 2026-06-18. Secrets antigos UPLOAD_POST_*/SUPABASE_* e
      # Variables CHAPTER_OFFSET/CHAPTER_TOTAL ficaram sem uso — podem ser deletados.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (Pillow + numpy)
        run: pip install --upgrade pip && pip install pillow numpy

      # FASE 1 — gera o carrossel, converte PNG→JPEG e (se !dry-run) stagea em docs/
      - name: Generate carousel (phase 1)
        run: node src/run-completo.mjs

      # Publica os JPEGs no GitHub Pages (só no modo real)
      - name: Commit & push images to Pages
        if: env.DRY_RUN != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/post-*/ || true
          if git diff --cached --quiet; then
            echo "Nada novo em docs/ pra commitar."
          else
            git commit -m "chore(tiktok): publica JPEGs do post (run ${{ github.run_id }})"
            git push
          fi

      # FASE 2 — espera o Pages, refresh do token, content/init (inbox) e avança estado.json
      - name: Post to inbox (phase 2)
        if: env.DRY_RUN != 'true'
        run: node src/run-completo.mjs --post

      # Persiste o avanço da fila de volta no repo
      - name: Commit & push estado.json
        if: env.DRY_RUN != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/openai/data/estado.json
          if git diff --cached --quiet; then
            echo "estado.json sem mudança."
          else
            git commit -m "chore(tiktok): avança fila após post (run ${{ github.run_id }})"
            git push
          fi

      - name: Upload outputs as artifact (debug + caminho manual)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_id }}
          path: engine/openai/outputs/
          if-no-files-found: ignore
          retention-days: 14
