name: post-carrossel

# Fase C — carrossel DIDÁTICO multi-slide (roteiro Igor → render Remotion N slides → JPEG → inbox FOTO).
#
# Cadência (2026-07-03): grade semanal — carrossel seg+sex, vídeo qua (post-video.yml). Alterna
# carrossel→vídeo→carrossel na semana. O PIL antigo (post-tiktok.yml) segue aposentado.
# IG cross-post LIGADO no cron desde 2026-08-01 (antes era só o vídeo de quarta que espelhava).
#
# Modos:
#   dry_run=true  (default) → GATE: gera roteiro + fundo + render N JPEG → sobe como artifact. Não posta.
#   dry_run=false           → + commita os JPEGs no Pages, posta no inbox (PHOTO) e avança estado-carrossel.json.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (gera JPEGs, não posta no inbox) — default TRUE'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      topico:
        description: 'Tópico do carrossel (vazio = usa a fila temas-video.json[estado-carrossel])'
        required: false
        default: ''
        type: string
      ig_crosspost:
        description: 'Espelhar no Instagram neste run (o cron usa a variable IG_CROSSPOST_CARROSSEL, default on)'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
  schedule:
    - cron: '0 11 * * 1,5'   # seg+sex 11h UTC = 8h BRT — religado 2026-07-08 (Gemini validado)

concurrency:
  group: post-carrossel
  cancel-in-progress: false

permissions:
  contents: write # só no modo real (commit dos JPEGs em docs/ + estado-carrossel.json)

jobs:
  carrossel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
      TOPICO: ${{ inputs.topico }}
      # Cross-post IG (full-auto, isolado). DECISÃO LUCAS 2026-08-01: o carrossel do CRON passa
      # a espelhar no IG também (era hard off; o IG só recebia o vídeo de quarta). Vale de seg
      # 03/08 em diante, toda segunda e sexta — não só uma vez.
      #   dispatch manual → manda o input ig_crosspost (default 'off', escolha explícita por run)
      #   cron            → repo VARIABLE IG_CROSSPOST_CARROSSEL; sem ela, 'on'.
      # Kill-switch sem commit: criar a variable IG_CROSSPOST_CARROSSEL=off em Settings →
      # Secrets and variables → Actions → Variables. O cross-post segue isolado (continue-on-error
      # + exit 0 interno): se o IG falhar, o post do TikTok não cai junto.
      IG_CROSSPOST: ${{ inputs.ig_crosspost || vars.IG_CROSSPOST_CARROSSEL || 'on' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}

    steps:
      # Disparo na branch errada tem que doer na hora: step (vermelho e explicado na aba
      # Actions), não `if` no job (some como "skipped"). Inerte no cron — schedule sempre
      # roda na default.
      - name: Guard — só roda na branch default
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Este workflow so pode rodar na branch default (${{ github.event.repository.default_branch }}). Disparado em '${{ github.ref_name }}' — abortando antes de gerar ou postar."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion deps
        working-directory: engine/remotion
        run: npm install

      - name: Gerar carrossel (roteiro -> fundo -> render N JPEG)
        run: node engine/video/run-carrossel.mjs

      - name: Upload JPEGs + artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_id }}
          path: |
            engine/remotion/out/carrossel/
            engine/video/out/
          if-no-files-found: warn
          retention-days: 14

      # ---- abaixo só no modo REAL. Dry-run para no artifact acima. ----
      - name: Commit & push JPEGs to Pages
        if: env.DRY_RUN != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/post-carrossel-*/ || true
          if git diff --cached --quiet; then
            echo "nada novo em docs/"
          else
            git commit -m "chore(carrossel): publica JPEGs multi-slide (run ${{ github.run_id }})"
            git push
          fi

      - name: Post to inbox (phase 2)
        if: env.DRY_RUN != 'true'
        run: node engine/video/run-carrossel.mjs --post

      # Cross-post Carrossel no IG (full-auto), DEPOIS dos JPEGs públicos no Pages. Isolado:
      # !cancelled() + continue-on-error + exit 0 interno = NUNCA derruba o job. Só com IG_CROSSPOST=on.
      - name: Cross-post Carrossel no Instagram (isolado)
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && env.IG_CROSSPOST == 'on' }}
        continue-on-error: true
        run: node engine/openai/src/cross-post-ig.mjs --carrossel

      # historico.json é o que cega a trava se não voltar pro repo — commitado no MESMO passo
      # que avança o estado. pauta.json volta com o item marcado postado/bloqueado.
      - name: Commit & push estado + historico/pauta
        if: env.DRY_RUN != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/video/estado-carrossel.json engine/video/estado-fundos.json \
                  data/historico.json data/pauta.json data/status-fila.json
          if git diff --cached --quiet; then
            echo "estado-carrossel sem mudança"
          else
            git commit -m "chore(carrossel): avanca fila + historico apos post (run ${{ github.run_id }})"
            git push
          fi
