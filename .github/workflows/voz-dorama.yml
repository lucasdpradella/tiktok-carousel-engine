name: voz-dorama

# Narração do dorama do canal @pradexapp. Sobe os WAVs como artifact — NÃO renderiza
# vídeo, NÃO posta, não toca em nada do canal pessoal.
#
# Diferente do voz-ci: aqui não há clonagem nem latents cifrados. O narrador do dorama é
# personagem, não o Lucas, então usa as vozes prontas do XTTS-v2. Por isso este workflow
# não precisa do VOICE_LATENTS_PASSPHRASE.

on:
  workflow_dispatch:
    inputs:
      episodio:
        description: 'Episódio (01 a 05)'
        required: true
        default: '01'
      listar_vozes:
        description: 'Só listar as vozes disponíveis do XTTS e sair'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COQUI_TOS_AGREED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Mesmas versões do voz-ci: o XTTS quebra com torch novo, e descobrir isso no
      # meio de uma síntese custa o run inteiro.
      - name: Install TTS
        run: |
          python -m pip install --upgrade pip
          pip install "TTS==0.22.0" "torch==2.1.2" "torchaudio==2.1.2" "transformers==4.36.2"

      - name: Listar vozes
        if: ${{ inputs.listar_vozes }}
        run: python engine/video/tts-dorama.py x x --listar

      - name: Gerar narração
        if: ${{ !inputs.listar_vozes }}
        run: |
          python engine/video/tts-dorama.py \
            engine/video/dorama-falas-ep${{ inputs.episodio }}.json \
            out/voz-ep${{ inputs.episodio }}

      - name: Subir artifact
        if: ${{ !inputs.listar_vozes }}
        uses: actions/upload-artifact@v4
        with:
          name: voz-dorama-ep${{ inputs.episodio }}
          path: out/voz-ep${{ inputs.episodio }}/
          retention-days: 14
